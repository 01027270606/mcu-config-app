name: Build Android APK

# 1. 트리거 조건: 코드가 업로드(Push)될 때마다 자동 실행
on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    # 2. 빌드 환경: 최신 우분투 Linux 가상 서버 사용
    runs-on: ubuntu-latest

    steps:
      # 3. GitHub 저장소에 올라간 코드들을 가상 서버로 가져옴
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 4. 가상 서버에 Flutter 및 Dart 개발 환경 자동 설치
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 5. pubspec.yaml에 명시된 라이브러리(dartssh2 등) 다운로드
      - name: Install Dependencies
        run: flutter pub get

      # 6. 핸드폰에 설치 가능한 Release 버전 APK 파일 빌드
      - name: Build APK
        run: flutter build apk --release

      # 7. 완성된 APK 파일을 다운로드받을 수 있도록 결과물 등록
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcu-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
