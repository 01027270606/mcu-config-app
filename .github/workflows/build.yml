name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter Project & Add Permissions
        run: |
          flutter create temp_app
          cd temp_app
          flutter pub add android_intent_plus
          
          # AndroidManifest.xml에 인터넷 권한 추가
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' android/app/src/main/AndroidManifest.xml
          
          cp ../pubspec.yaml .
          cp ../lib/main.dart lib/

      - name: Install Dependencies
        run: |
          cd temp_app
          flutter pub get

      - name: Build APK
        run: |
          cd temp_app
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcu-app-release
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk
